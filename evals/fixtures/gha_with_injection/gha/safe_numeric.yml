on:
  pull_request_target:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          # github-script with an interpolated expression — but the PR number is
          # numeric, not attacker-controlled text, so there is nothing to break
          # out with. Must NOT flag (guards against clearing github-script
          # vs. flagging it categorically).
          script: |
            const pr = ${{ github.event.pull_request.number }};
            console.log("Labeling PR " + pr);
