# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: review-pr comment-style A/B — does an edit change the comment that gets written?

# Mirrors the sibling detection suite: two providers, selected at run time via
# `--filter-providers <label>` (default bedrock, no Anthropic key needed).
# Override the Bedrock model/region with EVAL_BEDROCK_MODEL / AWS_REGION.
providers:
  - id: "bedrock:{{ env.EVAL_BEDROCK_MODEL or 'us.anthropic.claude-opus-4-1-20250805-v1:0' }}"
    label: bedrock
    config:
      region: "{{ env.AWS_REGION or 'us-east-1' }}"
      temperature: 0
      max_tokens: 1024
  - id: anthropic:messages:claude-opus-4-8
    label: anthropic
    config:
      temperature: 0
      max_tokens: 1024

# prompt.js builds the chat in plain JS; tests.gen.js bakes the live-or-frozen
# comment-style guidance into each scenario (RULE_VARIANT=old -> frozen baseline).
prompts:
  - file://prompt.js
tests: file://tests.gen.js

defaultTest:
  options:
    # llm-rubric grader. Cheap model; the rubrics are pass/fail discriminations.
    #
    # Deliberately a LITERAL id, not `{{ env.EVAL_BEDROCK_GRADER or '...' }}`.
    # The `or 'default'` fallback does not render: with the env var unset, the
    # whole template reaches Bedrock as a literal string and every rubric dies
    # with "The provided model identifier is invalid" — while promptfoo still
    # reports "0 errors (0%)", because a grader error is scored as a FAILED
    # ASSERTION, not an error. The result is an all-zero table that looks like a
    # real (catastrophic) measurement. Hardcoding the id removes the trap; the
    # grader is a fixed cheap model and never needed to vary per arm.
    #
    # Region is intentionally unset: with no `region` key the AWS SDK reads
    # AWS_REGION from the environment, which is how the justfile and README
    # already select it.
    provider: "bedrock:us.anthropic.claude-haiku-4-5-20251001-v1:0"
